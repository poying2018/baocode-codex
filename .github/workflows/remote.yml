# Builds the remote server (baocode-server, the app's side on an SSH host)
# for Linux and macOS, x64 and arm64, and runs it on each. docs/ssh-remote.md
# (9.3) has where the builds go and how the app finds them.
#
#   git tag server-foo && git push origin server-foo
#                                      build, and publish the builds at
#                                      this repository's releases.
#                                      <VERSION>/, latest.json there naming
#                                      them: for apps packaged locally with
#                                      --remote-release (tool/build_*.dart)
#   Actions 鈫?Remote server 鈫?Run workflow
#                                      build only, to try the build
#
# Release (release.yml) calls it too, for the builds both apps name; it
# publishes them itself, with the release.
name: Remote server

on:
  push:
    tags: ['server-*']
  workflow_dispatch:
    inputs:
      product:
        description: The product the server is for
        type: choice
        default: baocode-codex
        options: [baocode-codex, baocode-claude]
  workflow_call:
    inputs:
      product:
        # A string, not a choice: workflow_call takes no choice inputs — a
        # choice makes the whole file invalid, and every run of it fails.
        description: The product the server is for (baocode-codex, baocode-claude)
        type: string
        default: baocode-codex

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  build:
    name: Build the remote server (${{ inputs.product || 'baocode-claude' }})
    # A Mac, as only one builds for macOS: the Linux builds are
    # cross-compiled, the macOS x64 one by an x64 Dart SDK under Rosetta.
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # The product the server is for: the codex product's server has no
      # Claude Code in it (the two products are separate programs).
      PRODUCT: ${{ inputs.product || 'baocode-claude' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Get the x64 Dart SDK of Flutter's version
        run: |
          softwareupdate --install-rosetta --agree-to-license > /dev/null 2>&1 || true
          version=$(dart --version 2>&1 | sed -n 's/^Dart SDK version: \([^ ]*\) (\([a-z]*\)).*/\1 \2/p')
          read -r dart channel <<< "$version"
          echo "Dart $dart ($channel)"
          curl -fsSL -o "$RUNNER_TEMP/dart-x64.zip" \
            "https://storage.googleapis.com/dart-archive/channels/$channel/release/$dart/sdk/dartsdk-macos-x64-release.zip"
          unzip -q "$RUNNER_TEMP/dart-x64.zip" -d "$RUNNER_TEMP/dart-x64"
          "$RUNNER_TEMP/dart-x64/dart-sdk/bin/dart" --version
      # Once, for both apps: they carry its servers.json, and download the
      # build a host needs (docs/ssh-remote.md, 9.3).
      - name: Build for Linux and macOS, x64 and arm64
        run: |
          dart run tool/build_remote_server.dart --out build/remote --all \
            --product "$PRODUCT" \
            --macos-x64-dart "$RUNNER_TEMP/dart-x64/dart-sdk/bin/dart"
      - id: version
        run: echo "version=$(cat build/remote/VERSION)" >> "$GITHUB_OUTPUT"
      - name: Run the macOS builds here
        run: tool/test_remote_server_macos.sh build/remote
      - uses: actions/upload-artifact@v4
        with:
          name: remote-${{ env.PRODUCT }}
          if-no-files-found: error
          path: |
            build/remote/VERSION
            build/remote/servers*.json
            build/remote/*.gz
      - uses: actions/upload-artifact@v4
        with:
          name: remote-linux-${{ env.PRODUCT }}
          if-no-files-found: error
          path: |
            build/remote/VERSION
            build/remote/baocode*-server-linux-*
            !build/remote/*.gz

  linux:
    name: Run the remote server on Linux
    needs: build
    runs-on: ubuntu-latest
    env:
      PRODUCT: ${{ inputs.product || 'baocode-claude' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: remote-linux-${{ env.PRODUCT }}
          path: build/remote
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Run it on Linux distributions, in Docker
        run: |
          # Artifacts keep no modes.
          chmod 755 build/remote/baocode*-server-linux-*
          tool/test_remote_server.sh build/remote

  publish:
    name: Publish to this repository's release
    needs: [build, linux]
    # Its own server-* tag only: called by Release, the release publishes.
    if: github.event_name == 'push' && startsWith(github.ref_name, 'server-')
    runs-on: ubuntu-latest
    # The release environment, as the release's own jobs have it: the
    # permissions to write the release come with it.
    environment: release
    concurrency:
      group: remote-publish
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PRODUCT: ${{ inputs.product || 'baocode-claude' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: remote-${{ env.PRODUCT }}
          path: dist/remote
      - name: Upload the builds and their servers.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Named by what was built, so never changed once there. The
          # release of this repository carries them, not a CDN of
          # upstream's: the app downloads them from here.
          for file in dist/remote/*.gz dist/remote/servers*.json; do
            gh release upload "$GITHUB_REF_NAME" "$file" --clobber
          done
      - name: Name them in latest.json, last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n --arg version "$VERSION" --arg tag "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" \
            '{version: $version, tag: $tag, commit: $commit}' > "remote-latest-$PRODUCT.json"
          gh release upload "$GITHUB_REF_NAME" "remote-latest-$PRODUCT.json" --clobber
          {
            echo "## Remote server \`$VERSION\` (\`$GITHUB_REF_NAME\`, ${GITHUB_SHA::7})"
            echo
            echo "Package an app that downloads it:"
            echo
            echo '```'
            echo "dart run tool/build_windows.dart --remote-release $VERSION --product $PRODUCT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY
