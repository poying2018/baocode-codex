# Packs BaoCode's browser extension (browser_extension/) and publishes it to
# this repository's own release, which the app reads
# (lib/browser/extension_store.dart): the manifest at
# releases/download/extension/latest.json, and the zip to load unpacked at
# releases/download/browser-extension. The store's zip is attached too, for
# the Chrome Web Store, which takes the upload by hand unless the
# credentials are set.
#
#   git tag extension-v0.1.0 && git push origin extension-v0.1.0
#                           publish 0.1.0 (manifest.json's version)
#   git tag extension-test-foo && git push origin extension-test-foo
#                           pack, and attach the zips named after the tag
#   a pull request that changes the extension
#                           pack it, to see that it does
name: Extension

on:
  push:
    tags: ['extension-*']
  pull_request:
    paths:
      - 'browser_extension/**'
      - 'tool/pack_browser_extension.sh'
      - '.github/workflows/extension.yml'

permissions:
  contents: write

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/extension-v') && 'extension-release' || format('extension-build-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  # The extension's id: the store's, which the zip to load unpacked has too
  # (its manifest's "key"), and BaoCode lets in (BrowserBridge.extensionIds).
  EXTENSION_ID: jfjagocghaaheooicmdnhcholmgdkngk

jobs:
  pack:
    name: Pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      share: ${{ steps.version.outputs.share }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read the version, and match the tag against it
        run: |
          version=$(jq -r .version browser_extension/manifest.json)
          echo "manifest.json: $version"
          publish=false share=false
          case $GITHUB_REF_NAME in
            extension-v*)
              if [ "$GITHUB_REF_NAME" != "extension-v$version" ]; then
                echo "::error::Tag $GITHUB_REF_NAME, but the extension is $version: the tag has to be extension-v$version"
                exit 1
              fi
              publish=true ;;
            extension-test-*) share=true ;;
          esac
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "share=$share"
          } >> "$GITHUB_OUTPUT"
      - name: Check the extension
        run: |
          node --check browser_extension/background.js
          # The id BaoCode lets in is the manifest key's.
          id=$(jq -r .key browser_extension/manifest.json | base64 -d | sha256sum | head -c 32 | tr 0-9a-f a-p)
          [ "$id" = "$EXTENSION_ID" ] || { echo "::error::manifest.json's key is extension $id, not $EXTENSION_ID"; exit 1; }
          grep -q "'$EXTENSION_ID'" lib/browser/browser_bridge.dart \
            || { echo "::error::lib/browser/browser_bridge.dart does not let $EXTENSION_ID in"; exit 1; }
          # Each file the manifest names is there.
          jq -r '[.icons[], .action.default_icon[], .background.service_worker] | .[]' browser_extension/manifest.json \
            | while read -r file; do
                [ -f "browser_extension/$file" ] || { echo "::error::manifest.json names $file, not there"; exit 1; }
              done
      - name: Pack
        run: tool/pack_browser_extension.sh
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          if-no-files-found: error
          path: build/browser_extension/BaoCode-browser-*.zip

  publish:
    name: Publish to this repository's release
    needs: pack
    if: needs.pack.outputs.publish == 'true' || needs.pack.outputs.share == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.pack.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: dist
      - name: Attach the zips to the extension release
        run: |
          # One release, tagged `extension`, is the extension's home: it is
          # made once and every version's files are attached to it, named so
          # that they do not overwrite one another (a tester's carry the tag
          # they were packed from).
          gh release view extension --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create extension --repo "$GITHUB_REPOSITORY" \
                 --title "The browser extension" \
                 --notes "The browser extension's builds: the zip to load unpacked at releases/download/browser-extension, its manifest at releases/download/extension/latest.json."
          for file in dist/BaoCode-browser-*.zip; do
            case "$GITHUB_REF_NAME" in
              extension-v*) name=$(basename "$file") ;;
              *)            name="$(basename "$file" .zip)-${GITHUB_REF_NAME#extension-}.zip" ;;
            esac
            cp "$file" "$name"
            gh release upload extension "$name" --clobber --repo "$GITHUB_REPOSITORY"
          done
      - name: Write the manifest, and check the download is served
        if: needs.pack.outputs.publish == 'true'
        run: |
          # Where the app reads it: releases/download/extension/latest.json.
          file="dist/BaoCode-browser-$VERSION.zip"
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          size=$(stat -c %s "$file")
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/extension/BaoCode-browser-$VERSION.zip"
          jq -n --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg id "$EXTENSION_ID" \
            --arg store "https://github.com/$GITHUB_REPOSITORY/releases/tag/extension" \
            --arg url "$url" --arg sha "$sha" --argjson size "$size" \
            '{version: $version, pubDate: $date, id: $id, store: $store,
              downloads: {"browser-extension": {url: $url, size: $size, sha256: $sha}}}' > latest.json
          cat latest.json
          gh release upload extension latest.json --clobber --repo "$GITHUB_REPOSITORY"
          # The app's own name for the zip: a stable address that sends it
          # to the newest, which openZip opens.
          cp "$file" browser-extension.zip
          gh release upload extension browser-extension.zip --clobber --repo "$GITHUB_REPOSITORY"
